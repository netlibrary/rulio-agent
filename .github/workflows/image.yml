# Image für den Dauerbetrieb auf einer VM (rulio-tickets#30) → ghcr.io.
#
# Nur bauen und ablegen: Ausgerollt wird in netlibrary/finance-deployment
# (deploy-agent.yml), damit dieses Repo keinen Zugang zur VM braucht. Gebaut
# wird für amd64 und arm64 — welche Architektur die VM hat, muss dieses Repo
# dann nicht wissen.
name: Image
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/netlibrary/rulio-agent:latest
            ghcr.io/netlibrary/rulio-agent:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max
